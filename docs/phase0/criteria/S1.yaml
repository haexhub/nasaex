# Acceptance criteria of spike S1 (spec User Story 1, FR-012 to FR-014). Draft: the shakedown
# (task T051) may change the structure of a check, never an expected value derived here; every
# pre-freeze edit is noted in `changelog`. Checks: spikes/phase0/vm-tests/s1/.
spike: S1
criteria_version: 1
status: draft
name: The tiered-cache share behaves like a normal filesystem
gates: ADR-0002
fallback: >-
  S1 FAIL: the tiered-cache share is abandoned; ADR-0002 falls back to direct archive access,
  read-only when degraded (the fallback already written in ADR-0002). The merged share is
  dropped; how the pool is exposed in that case, and whether the mover design survives, is
  decided in the ADR update (spec FR-031).

tables:
  # The one SMB share of the server (task T041) and the keys the probe of task T039 measured as
  # required: without them a DOS attribute change is lost and user xattrs fail with EOPNOTSUPP.
  share:
    name: cache
    path: /mnt/cache
    user: spike
    required_keys:
      store dos attributes: "yes"
      ea support: "yes"
  # The baseline mount of the cache pool (plan O16 and O9, spikes/phase0/nix/tiered-cache.nix).
  # The unlink policy is the mergerfs default: no func.unlink option is set and the effective
  # policy, read at run time, is expected to be epall (spec Clarifications 2026-10-17).
  baseline:
    category.create: ff
    archive_branch_mode: NC
    moveonenospc: "false"
    minfreespace: 64M
    passthrough.io: "off"
    cache.files: "off"
    func.unlink: epall
  # The mount options each variant of a mount-variants scenario changes against the baseline.
  mount_variants:
    ff: {}
    lus:
      category.create: lus
    baseline: {}
    passthrough-rw-auto-full:
      passthrough.io: rw
      cache.files: auto-full
  # Bounded times of the verdict model (initial targets, not measured).
  bounds:
    client_operation_s: 30
    view_consistency_s: 30
  # S1.8: the byte whose bits a case flips in place in the archived file above 4 GiB (beyond
  # 2**32, so 64-bit offsets are exercised); each case flips its own byte.
  large_file:
    flip_offset:
      baseline: 4294967301
      passthrough-rw-auto-full: 4294967302
  # S1.9: the filler leaves `leave_bytes` free on the pool, above `minfreespace`, so the create
  # policy still selects the pool and the write of `write_bytes` fails there (research F10).
  out_of_space:
    errno: ENOSPC
    smb_status: NT_STATUS_DISK_FULL
    leave_bytes: 100663296
    write_bytes: 268435456
  # S1.2, proposed (spec Clarifications 2026-10-19, NC placement): the filler of the pool-low
  # step leaves `leave_bytes` free on the pool, below minfreespace, so the baseline create policy
  # does not choose the pool and only the no-create mode keeps a create off the archive branches.
  placement_pool_low:
    leave_bytes: 16777216
  # S1.11: the reboots in a row (one reboot cannot show a rare boot race) and the unit of the
  # two-device pool that the server must carry (spec Clarifications 2026-10-19, S1.11 reboots).
  reboot:
    count: 20
    retrigger_unit: pool-retrigger.service
  # S1.10: the points of the move primitives (contracts/mover-steps.md, M1 and M5) at which the
  # share is observed, and the refresh procedure, none until the shakedown finds one is needed.
  mover_view:
    points:
      - mid:M1:tmp-created
      - mid:M1:tmp-partial
      - mid:M1:tmp-data-synced
      - mid:M1:renamed
      - mid:M1:parent-synced
      - mid:M1:item-1-done
      - mid:M5:item-validated
      - mid:M5:unlinked
      - mid:M5:item-1-done
    refresh_procedure: []

scenarios:
  - id: S1.1
    title: Archive-only files read through the share equal the reference, and the trash stays hidden
    precondition: >-
      The share is the cache pool (pool branch first, archive branches after it in mode NC); the S1
      data set is populated (spikes/phase0/vm-tests/s1/fixture.py), including trash entries beside
      the branch directory of arch0 and arch2, one of them at the path shared/trashed-then-created.txt.
    action: >-
      The client lists, reads and checksums every archive-only file and directory through the
      mount.cifs mount, checksums the archive-only files with smbclient and reads the DOS attributes
      of every archive path with smbclient allinfo; the server reads mode, owner and group of every
      archive path on the cache pool mount /mnt/cache and lists the cache pool and the base pool;
      the client creates shared/trashed-then-created.txt through the share.
    observable: >-
      The reference is the manifest derived on the host from the data set description (never read
      from guest storage), owned by the uid and primary gid of tables.share.user as resolved on the
      server (id -u, id -g). Through the share, every path of the archive branches is listed with
      its reference type, and every archive file has the reference size, the reference mtime in
      whole seconds (exact equality of the truncated st_mtime, as S1.10 and S1.11 compare it) and
      the reference SHA-256 through mount.cifs; smbclient checksums of every archive file up to 64
      MiB equal the reference (the file above 4 GiB is S1.8's); smbclient allinfo shows the
      directory bit 0x10 exactly on directories and none of readonly 0x01, hidden 0x02 and system
      0x04. On /mnt/cache every path of the archive branches has the reference mode (stat.S_IMODE)
      and the uid and gid of the reference. Recorded, not judged: the mode, uid and gid that
      mount.cifs reports and the full allinfo mask of each path. No trash directory and no trash
      entry appears in the client manifest or in the listing of the cache pool or the base pool;
      the created file shows its own content through the share, lies on the pool branch only, and
      the trash directories equal their reference manifests (no collision).
    check: archive_view
  - id: S1.2
    title: New files and directories land on the pool only
    precondition: >-
      The cache pool with the variant's create policy and the archive branches in mode NC; a
      directory that exists only on an archive disk.
    action: >-
      The client creates a file and a directory inside the archive-only directory and a new
      top-level directory with a file; then, with the NC mode removed from the archive branches, the
      client creates one more file inside the archive-only directory. Then a filler (fault kind
      enospc) leaves tables.placement_pool_low.leave_bytes free on the pool branch, below
      minfreespace; with NC in effect the client creates a small file inside the archive-only
      directory through mount.cifs and one with smbclient put; with the NC mode removed, the client
      creates the mount.cifs file once more; the file and the filler are removed and the check
      polls f_bavail of the pool branch every 0.5 s, at most 60 s, until it is back to its value
      before the filler less 16 MiB.
    observable: >-
      Every new path exists on the pool branch with its expected content and on no archive branch;
      the tree hash of every archive branch is the same before and after; the client manifest shows
      the archive-only and the new content as one tree. The branch that held the file created without
      NC is recorded as evidence and is not a pass condition. With the pool branch below
      minfreespace and NC in effect, neither create reports success, neither path exists on any
      branch and the tree hash of every archive branch is unchanged; their errno and SMB status are
      recorded; the space is back within the poll bound. The branch that holds the file created
      there without NC and the available bytes of every branch before that create are recorded as
      evidence and are not a pass condition. Required settings recorded: create policy and archive
      branch mode.
    check: new_data_placement
    cases: mount-variants
    variants:
      - case: ff
        gating: true
        description: Baseline create policy ff.
      - case: lus
        gating: false
        description: Informational create policy lus.
  - id: S1.3
    title: An archive-only file is modified in place
    precondition: A file that exists only on the archive branch arch1.
    action: The client flips the bits of three bytes of the file in place through the share.
    observable: >-
      The client reads the expected new content; the file on arch1 has the expected new content and
      the same inode; no path of it exists on the pool branch; every other file on the pool and the
      archive branches has the same type, size and SHA-256 as before, and no path appeared or
      disappeared.
    check: inplace_modify
  - id: S1.4
    title: An archive-only file is deleted in place
    precondition: >-
      A file that exists only on the archive branch arch0; for the measurement, a file with the same
      content at the same path on the pool branch and on arch1.
    action: >-
      The client deletes the archive-only file through the share; for the measurement the client
      deletes the file held on two branches through the share.
    observable: >-
      The archive-only file is not visible through the share and exists on no branch; the manifest of
      the pool branch is unchanged (no marker, no copy). Recorded in the evidence, not a pass
      condition: the branches that held the two-branch file before and after its delete, whether it
      was visible afterwards, and the effective func.unlink of the cache pool.
    check: inplace_delete
  - id: S1.5
    title: A deleted archive file or directory recreated through the share shows only new content
    precondition: >-
      An archive-only file on arch0 and an archive-only directory with entries on arch0 and arch1.
    action: >-
      The client deletes the file and creates a new file with other content at the same path; it
      deletes the directory with its entries, creates a directory at the same path and a file in it;
      the client mounts the share again and reads once more.
    observable: >-
      Before and after the new mount the file shows the new content and the directory lists only the
      new file; no branch holds the old file content at the path or any old entry of the directory.
    check: delete_then_recreate
  - id: S1.6
    title: Renames and moves of every origin succeed completely
    precondition: >-
      Through the share: an archive-only file, a pool-only file, an archive-only directory on two
      archive disks, a pool-only directory, a directory on the pool and an archive branch, a pool-only
      target directory and an archive-only target directory.
    action: >-
      The client renames each file and directory within its parent, moves an archive-only file into
      the pool-only directory and a pool-only file into the archive-only directory.
    observable: >-
      Every rename exits with status 0; the client manifest under each new name equals the manifest
      under the old name before the rename (type, size, mtime, mode, user xattrs, SHA-256), and
      nothing is visible under any old name. A rename error (for example EXDEV) or a partial result is
      a FAIL of the baseline unless a setting recorded as required makes it succeed.
    check: rename_move
    cases: mount-variants
    variants:
      - case: baseline
        gating: true
        description: Baseline passthrough.io=off and cache.files=off.
      - case: passthrough-rw-auto-full
        gating: false
        description: Informational passthrough.io=rw with cache.files=auto-full (plan O9).
  - id: S1.7
    title: Extended attributes and SMB attributes survive rename, remount, a second client and the mover
    precondition: >-
      An archive-only file and a pool-only file, each carrying a user xattr set on its branch.
    action: >-
      The client sets a user xattr through the mount.cifs mount and the hidden and system DOS
      attributes with smbclient setmode on each file, then renames each file, mounts the share again,
      reads through a second SMB session (a second mount.cifs mount with nosharesock and actimeo=0)
      and smbclient, and the pool file is moved into the archive with the move primitives of the
      mover.
    observable: >-
      After every step the user xattr set by the client and the xattr already present on the branch
      read back with their values through the mount.cifs mounts, and smbclient allinfo shows the
      hidden and system bits. DOS attributes are read with smbclient allinfo only, never through the
      cifs pseudo-xattr.
    check: attributes_preserved
  - id: S1.8
    title: Files larger than 4 GiB keep their content end to end
    precondition: >-
      large/archived.bin (4 GiB plus one chunk and one byte) on the archive branch arch1.
    action: >-
      The client checksums the archived file through mount.cifs and smbclient, copies it within the
      share and checksums the copy, writes large/new-through-share.bin (above 4 GiB) through the
      share, and flips the bits of the case's byte above 4 GiB of the archived file in place.
    observable: >-
      Every checksum equals the reference; the copy and the new file lie on the pool branch only; after
      the flip the archived file reads with the expected new SHA-256 through the share and on arch1,
      keeps its inode, and no copy of it exists on the pool branch.
    check: large_files
    cases: mount-variants
    variants:
      - case: baseline
        gating: true
        description: Baseline passthrough.io=off and cache.files=off.
      - case: passthrough-rw-auto-full
        gating: false
        description: Informational passthrough.io=rw with cache.files=auto-full (plan O9).
  - id: S1.9
    title: A full pool gives a clean out-of-space error
    precondition: >-
      A filler file on the pool leaves leave_bytes free, above minfreespace; a pool file to append to.
    action: >-
      The client creates a file of write_bytes through mount.cifs, uploads one of the same size with
      smbclient put, and appends write_bytes to the pool file through mount.cifs, each write from the
      precondition and from a seeded source of write_bytes (the same bytes on client and server,
      never a constant byte or a sparse zero file) while the server watches the archive
      filesystems for write events; then the server removes the filler, the client deletes the
      leftover of the create and of the upload through the share, and the check polls statvfs
      f_bavail of the pool branch every 0.5 s until it is at least the bytes of the last filler
      plus the sizes of the deleted leftovers less 16 MiB (btrfs frees the space at its next
      transaction commit, 30 s by default; the scenario fails if it has not appeared after 60 s,
      and the seconds until it appeared are recorded); right after the deletion and before the
      poll, the client creates an empty file through mount.cifs and one with smbclient put, a
      create that succeeds being deleted through the share before the poll; the client then
      repeats each write, the append through a mount.cifs session of its own (nosharesock), the
      writer session's size before that retry being recorded.
    observable: >-
      Per write: the mount.cifs create and append fail with errno ENOSPC and smbclient reports
      NT_STATUS_DISK_FULL, no write reports success; the tree hash of every archive branch and
      every trash directory is unchanged and no write event occurs on the archive filesystems; any
      written path that remains exists on the pool branch only; any leftover at the path, read
      on the pool branch, is a byte-exact prefix of the source (for the append, the bytes after the original
      head; never zero-filled, never other content); the manifest of the pool branch without the
      written path and the filler is identical before and after; the appended file still begins
      with its original bytes. Each repeated write reports no error, lies on the pool branch only
      and reads back with the written data (the append: original head, leftover, source).
      Recorded, not judged: the leftover's size and the sizes that the writer's session, the
      second session and the server report; the refusal window, the seconds from the end of the
      client's deletion of the leftovers until the poll saw the freed space, during which a
      create through the share is refused (EROFS, NT_STATUS_MEDIA_WRITE_PROTECTED; probe T051h),
      a finding beyond the 60 s bound of the poll; the errno and SMB status of the two empty
      creates. Required settings recorded: archive branch mode, moveonenospc and minfreespace,
      with the refusal window beside them.
    check: pool_out_of_space
  - id: S1.10
    title: A file moved the mover's way keeps the same view through the share
    precondition: A pool-only file with a user xattr, read through the share; a client reader holds it open.
    action: >-
      The server moves the file with the move primitives of the mover (copy through the base pool,
      then unlink of the pool copy) and stops at each point of tables.mover_view.points; the reader
      finishes reading after the move.
    observable: >-
      At every point the file is visible through the share with its full size and expected SHA-256;
      the reader reads the complete expected content; the mover exits with status 0; after the move
      the client manifest of the file's directory (path, type, size, mtime, mode, SHA-256) equals the
      manifest before the move within bounds.view_consistency_s without intervention, or after the
      verified refresh procedure of tables.mover_view.refresh_procedure. A differing view after both
      is a FAIL; the time to a consistent view is recorded.
    check: mover_view
  - id: S1.11
    title: The share comes back after repeated reboots with the same view
    precondition: >-
      The share populated with archive and pool files; the server carries the required unit
      tables.reboot.retrigger_unit of the two-device pool (spec Clarifications 2026-10-19).
    action: >-
      The client reads the manifest of the whole share and unmounts; the server reboots
      tables.reboot.count times in a row, nothing mounted or started by hand on the server; after
      each boot the check waits for multi-user.target and an empty job queue; after the last boot
      the client mounts the share again and reads the manifest of the whole share.
    observable: >-
      After every boot the base pool, the cache pool and smbd are active and every by-label mount
      of /etc/fstab is mounted; a boot that does not settle or misses any of them fails the
      scenario, its boot diagnostics are captured (status/S1.11-boot-diagnostics.json) and no
      further reboot runs. After the last boot the client manifest of the whole share (path, type,
      size, mtime, mode, user xattrs, SHA-256) is identical to the one before the first reboot.
      Recorded, not judged, per reboot: the result, exit status and run time of the retrigger unit
      and the shutdown and boot times; the number of reboots completed. Required settings
      recorded: the retrigger unit (name and unit text).
    check: reboot_view

changelog:
  - >-
    2026-10-17, draft (task T042): scenarios S1.1 to S1.11 from spec User Story 1; S1.2 runs the
    baseline ff and the informational lus, S1.6 and S1.8 the baseline and the informational
    passthrough.io=rw with cache.files=auto-full (plan O9); S1.10 has no refresh procedure yet.
  - >-
    Probe T039 (2026-10-17, Samba 4.23.10, kernel cifs client of 6.18.56, mergerfs 2.41.1,
    cache-pool share): DOS attributes are read with smbclient allinfo and changed with smbclient
    setmode; the cifs pseudo-xattr user.cifs.dosattrib shows them and can set them, but it showed a
    stale value after a change by smbclient until the share was mounted again, so it is not used to
    judge. User xattrs are set and read through the mount.cifs mount as user.* and are stored under
    the same name on the branch that holds the file; xattrs already on a branch file are visible
    through the share. Samba stores DOS attributes in user.DOSATTRIB on the branch file (through
    mergerfs). With store dos attributes = no a setmode reports success but the change is lost, and
    with ea support = no a client cannot set user xattrs (EOPNOTSUPP) and does not see branch
    xattrs. Both keys are yes by default in 4.23.10 and are set explicitly (tables.share).
  - >-
    Probes T037c and T037f (2026-10-17, mergerfs 2.41.1, Samba 4.23.10): with no func.unlink option
    the effective unlink policy of the cache pool is epall, and a client delete through the share of
    a file held on the pool branch and an archive branch removed both copies; with func.unlink=ff
    the archive copy stayed and was visible. S1 scenarios 4 and 5 behaved as required under both.
    Decision of 2026-10-17 (spec Clarifications, unlink policy): epall stays, no func.unlink option;
    S1.4 records the effective policy, it is not a pass condition.
  - >-
    Open before the freeze (S1.1 permissions): the probe of T039 saw client modes 0555 and 0755
    that follow the DOS readonly bit (smb_attrs.results.md, other observations; inferred, not
    measured), so a mount.cifs mode is not the branch mode; S1.1 compares the mode as spec User
    Story 1 scenario 1 states, and the shakedown (T051) shows what the client reports.
  - >-
    Open for the shakedown (T051): the time to a consistent view after a move (S1.10) or the
    refresh procedure, and whether NC excludes a branch from moveonenospc (research F10).
  - >-
    Shakedown T051 (2026-10-18, mergerfs 2.41.1, Samba 4.23.10, kernel and cifs client
    6.18.56, mount.cifs 7.5, btrfs-progs 6.19.1, QEMU 10.2.4; VMs 1536 + 768 MiB; full runs of
    947 s, 670 s and 652 s against the budget of 1200 s, S1.8 alone 679 s, 470 s and 439 s).
    Harness defects fixed before the second run, no expected value changed: the enospc filler
    was sized from a free count that btrfs had not yet updated for the files S1.8 deleted (the
    pool still had 4 GiB free, every S1.9 write succeeded); the S1.9 writes shared one filler,
    so the partial file of the first used up the free bytes of the next; S1.9 read new-file
    sizes through the attribute-caching mount only; effective option values carried a line
    end.
  - >-
    Shakedown T051, S1.1 permissions (open point above, measured): every other field matched
    (23 archive paths, 12 smbclient checksums, no trash entry in the share, the cache pool or
    the base pool, the file created at the trashed path on the pool only, trash unchanged).
    Through mount.cifs all 13 archive files show mode 0755 whatever their branch mode (11 of
    0644, one 0640, one 0600); the 10 directories show 0755, equal to their branch mode, so
    nothing tells whether that value is the branch's. mount.cifs(8), FILE AND DIRECTORY
    OWNERSHIP AND PERMISSIONS: without unix extensions files and directories "will have
    permissions set to the default file_mode and dir_mode for the mount". S1.1 therefore fails
    on the mode alone; the comparison stays as written until the maintainer decides where the
    mode is compared (for example on the server-side cache-pool mount).
  - >-
    Shakedown T051, S1.9 (after the harness fixes, every write from 100663296 free bytes):
    the mount.cifs create and append fail with ENOSPC and smbclient put reports
    "cli_push returned NT_STATUS_DISK_FULL" (then NT_STATUS_INVALID_NETWORK_RESPONSE on
    close); the archive tree hashes are unchanged and the append target keeps its head. The
    partial files stay: the create left 100660272 bytes (second session; the writer's own
    mount showed the written 268435456 bytes), the upload 201322496 bytes in both sessions,
    so the observable "no file at either new path is visible with fewer bytes than written"
    is not met; it is not edited (rule 2) and is open for the maintainer. Seen once while the
    writes still shared a filler: with the pool below minfreespace and the archive branches
    NC, smbclient put failed at open with NT_STATUS_MEDIA_WRITE_PROTECTED, not a disk-full
    status; the criteria name no status for that state. Whether NC excludes a branch from
    moveonenospc is not measured: the baseline runs with moveonenospc false (read back as
    false) and no case turns it on, so research F10 stays UNVERIFIED; the criteria either keep
    moveonenospc=false as a required setting or need a case that measures it.
  - >-
    Shakedown T051, S1.10 and the others: at all nine points the moved file was visible with
    its full size and SHA-256, the open reader read the complete content, the mover exited 0,
    and the directory manifest equalled the one before the move at the first poll (0.100 s,
    0.085 s and 0.099 s after the mover ended), so no refresh procedure is needed and
    tables.mover_view.refresh_procedure stays empty. S1.2: with NC removed, ff and lus both
    still placed the new file on the pool (the pool is first and had room), so the evidence
    shows no case in which NC decides the placement while the pool has free space. S1.4: the
    effective unlink policy is epall and the client delete removed the pool and the archive
    copy. The archive tree hashes, which include user xattrs, did not change in S1.2 and S1.9,
    so listing and reading through the share wrote no user.DOSATTRIB on archive files.
  - >-
    Shakedown T051, S1.11 (boot of the two-device pool): the first reboot brought the pools and
    smbd back, and so did the third (members scanned 3.8 ms apart); in the second (one boot in
    three), both pool members were scanned 2.3 ms apart by two udev workers,
    dev-disk-by\x2dlabel-spikepool.device timed out and mnt-pool, mnt-base and mnt-cache failed
    with result 'dependency'. The 64-btrfs.rules of systemd 260.5 mark a member not ready until
    the volume is complete and retrigger the pending members when it is; that did not happen
    here. The criteria need a mount setting for the two-device pool that is recorded as
    required (not found yet, UNVERIFIED) and a number of reboots, since one reboot cannot show
    a race.
  - >-
    2026-10-18, spec amendment (spec Clarifications 2026-10-18, S1.1 permissions), closing the
    open S1.1 points above (before the freeze, and of the shakedown): S1.1 compares mode, owner
    and group on the cache pool mount of the server, where mergerfs must pass the branch
    attributes through, and through the share only names, types, sizes, mtimes, content and the
    DOS attributes of smbclient allinfo; the mount.cifs mode and user xattrs are no longer
    compared by S1.1 (S1.7 judges branch xattrs through the share). That the mount.cifs mode is
    not the branch mode is measured: the shakedown saw 0755 on all 13 archive files whatever
    their branch mode (11 of 0644, one 0640, one 0600), as mount.cifs(8) documents without unix
    extensions. What mount.cifs reports is recorded, not judged; smb3 unix extensions, the posix
    mount option and NT ACLs are not used. The DOS attribute expectation and dropping the user
    xattrs are proposed. UNVERIFIED until the shakedown runs the amended check (T043a): the DOS
    expectation and whether mergerfs passes mode, owner and group through on /mnt/cache; not
    known either: whether the 0755 of the archive directories through mount.cifs is their
    branch mode or the mount's default.
  - >-
    2026-10-19, spec amendment (spec Clarifications 2026-10-19, S1.9 out of space), the
    maintainer's decision on the open S1.9 point of the shakedown, not a re-prediction from it:
    probes T051b and T051c measured that the leftover of a failed write is a byte-exact prefix of
    the written data on plain btrfs, through Samba without mergerfs and through mergerfs alike,
    so "no file visible with fewer bytes than written" fails on every filesystem measured. S1.9
    now judges that every client reports the error, archive branches and trash are unchanged
    (tree hashes, no write event), any remaining written path is on the pool branch only, a leftover
    is a prefix of the written bytes, no other pool file changed, the append head is intact and the repeated
    write succeeds; the writes use seeded content so that a zero-filled leftover fails. Proposed:
    the order of the retry and recording the reported sizes without judging them; the retry is
    UNVERIFIED (not measured). The check is amended by T047a.
  - >-
    2026-10-19, probe T051h (PR https://github.com/haexhub/nasaex/pull/34: mergerfs 2.41.1, Samba
    4.23.10, mount.cifs 7.5, kernel 6.18.56, btrfs-progs 6.19.1, pool mounted without commit=,
    so the 30 s default), harness fix of the retry of S1.9, no expected value changed: after the
